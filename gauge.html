<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            background: transparent;
            font-family: 'Consolas', monospace;
            color: #fff;
            overflow: hidden;
        }

        .gauge-wrapper {
            position: relative;
            width: 180px;
            height: 180px;
            margin: 0 auto;
        }

        .gauge-svg {
            transform: rotate(-90deg);
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        .gauge-circle-bg {
            fill: none;
            stroke: #1E293B;
            stroke-width: 10;
        }

        .gauge-circle-fill {
            fill: none;
            stroke-width: 12;
            stroke-linecap: round;
            filter: drop-shadow(0 0 4px currentColor);
            will-change: stroke-dasharray;
        }

            /* Smooth fill transition with longer duration, refined easing, and subtle overshoot */
            .gauge-circle-fill.animate {
                transition: stroke-dasharray 1.4s cubic-bezier(0.34, 1.3, 0.64, 1), stroke 0.4s ease, filter 0.4s ease;
            }

            .gauge-circle-fill.striking {
                animation: color-pulse 0.5s ease-out;
            }

        @keyframes color-pulse {
            0% {
                stroke: white;
                filter: drop-shadow(0 0 4px white);
            }

            50% {
                stroke: white;
                filter: drop-shadow(0 0 10px white);
            }

            100% {
                stroke: currentColor;
                filter: drop-shadow(0 0 4px currentColor);
            }
        }

        .temp-display {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            width: 100%;
        }

        .temp-value {
            font-size: 30px;
            font-weight: 800;
            color: #fff;
            transition: color 0.3s ease;
        }

        .temp-unit {
            font-size: 12px;
            color: #38BDF8;
            font-weight: 800;
        }
    </style>
</head>
<body>
    <div class="gauge-wrapper">
        <svg class="gauge-svg" viewBox="0 0 120 120">
            <circle class="gauge-circle-bg" cx="60" cy="60" r="50"></circle>
            <circle class="gauge-circle-fill" id="fill"
                    cx="60" cy="60" r="50"></circle>
        </svg>
        <div class="temp-display">
            <span class="temp-value" id="val">--</span>
            <span class="temp-unit">°C</span>
        </div>
    </div>

    <script>
        const CIRC = 2 * Math.PI * 50;
        const fill = document.getElementById('fill');
        const val = document.getElementById('val');

        function getTempColor(v) {
            if (v === null || v === undefined || isNaN(v)) return '#ef4444';
            v = parseFloat(v);
            if (v > 8) return '#ff3131';
            if (v >= 0 && v <= 8) return '#10b981';
            if (v > -18 && v < 0) return '#38bdf8';
            return '#0a4d8c';
        }

        function getPercentage(v) {
            if (v === null || isNaN(v)) return 0;
            v = parseFloat(v);
            let pct;
            if (v >= 0) {
                pct = v <= 8 ? (v / 8) * 0.7 : 0.7 + (Math.min(v, 20) - 8) / 12 * 0.25;
            } else {
                pct = (Math.abs(Math.max(v, -29)) / 29) * 0.95;
            }
            return Math.min(pct, 0.95);
        }

        // Start empty
        fill.style.strokeDasharray = `0 ${CIRC}`;

        window.setGauge = function (temp, minLimit, maxLimit) {
            const isError = (temp === null || temp === undefined || isNaN(temp));
            const color = isError ? '#ef4444' : getTempColor(temp);
            const pct = isError ? 0 : getPercentage(temp);

            // 1. Snap to EMPTY (no transition) + set color + text
            fill.classList.remove('animate');
            fill.style.strokeDasharray = `0 ${CIRC}`;
            fill.style.stroke = color;
            fill.style.color = color;
            val.style.color = color;
            val.textContent = isError ? 'ERR' : parseFloat(temp).toFixed(2);

            // 2. Force reflow so the empty state is rendered
            void fill.offsetWidth;

            // 3. White flash
            fill.classList.remove('striking');
            void fill.offsetWidth;
            fill.classList.add('striking');

            // 4. After 100 ms, enable transition and fill to target
            setTimeout(() => {
                fill.classList.add('animate');
                const filled = pct * CIRC;
                fill.style.strokeDasharray = `${filled} ${CIRC - filled}`;
            }, 100);

            // 5. Cleanup flash
            setTimeout(() => fill.classList.remove('striking'), 600);
        };
    </script>
</body>
</html>
